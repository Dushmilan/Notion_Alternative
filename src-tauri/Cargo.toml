[package]
name = "notion_alternativedev"
version = "0.1.0"
description = "Local-first Notion alternative with Google Drive sync"
authors = ["you"]
edition = "2021"

[lib]
name = "notion_alternativedev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
